<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <style>
    :root{--bg1:#06121f;--bg2:#081a2e;--bg3:#0a2436;--card-bg:rgba(10,24,40,.82);--card-border:rgba(56,189,248,.24);--accent:#38bdf8;--accent2:#22c55e;--text-main:#eff6ff;--text-muted:#a7c0da}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text-main);background:radial-gradient(circle at top left,rgba(34,197,94,.18),transparent 28%),radial-gradient(circle at top right,rgba(56,189,248,.22),transparent 30%),linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));min-height:100vh;overflow-x:hidden;position:relative}
    body::before{content:"Y Y Y Y Y Y Y Y Y Y Y Y Y Y Y";position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(3rem,10vw,8rem);font-weight:900;letter-spacing:.4em;color:rgba(96,165,250,.05);pointer-events:none;transform:rotate(-18deg);user-select:none;z-index:0;text-shadow:0 0 14px rgba(34,197,94,.12),0 0 24px rgba(56,189,248,.12);white-space:pre-wrap;line-height:1.8;padding:10vh 6vw;text-align:center}
    .nav-inner{max-width:1120px;margin:0 auto;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative;z-index:2;flex-wrap:wrap}.brand{display:flex;flex-direction:column;gap:4px}.brand h2{margin:0;font-size:1.35rem;letter-spacing:.04em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(56,189,248,.22)}.brand span{color:var(--text-muted);font-size:.9rem}nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.nav-link{padding:9px 14px;border-radius:999px;text-decoration:none;color:#eff6ff;border:1px solid rgba(96,165,250,.22);background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(7,18,32,.88));box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s}.nav-link:hover{transform:translateY(-2px);border-color:rgba(34,197,94,.55)}main{max-width:1120px;margin:22px auto 20px;padding:22px;position:relative;z-index:1}main>*{background:var(--card-bg);border:1px solid var(--card-border);backdrop-filter:blur(16px);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.28);padding:24px}a{color:#7dd3fc}a:hover{color:#86efac}h1,h2,h3{color:#fff}.secret-footer{text-align:center;padding:22px 14px 34px;position:relative;z-index:2}.secret-footer a{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(167,192,218,.35);text-decoration:none;letter-spacing:.22em;transition:.2s}.secret-footer a:hover{color:#7dd3fc;letter-spacing:.28em}@media(max-width:760px){.nav-inner{flex-direction:column;align-items:flex-start}nav{justify-content:flex-start}main{padding:14px}main>*{padding:18px;border-radius:20px}}
  </style>
</head>
<body>
<header><div class="nav-inner"><div class="brand"><h2>Yuvansh’s Lab</h2><span>Blue power. Green spark. Hidden Y magic everywhere.</span></div><nav><a class="nav-link" href="/">Home</a><a class="nav-link" href="/updates/">Updates</a><a class="nav-link" href="/school/">School</a><a class="nav-link" href="/projects/">Projects</a><a class="nav-link" href="/ai/">Custom AIs</a><a class="nav-link" href="/youtube/">YouTube</a><a class="nav-link" href="/gallery/">Gallery</a><a class="nav-link" href="/yuvanshcomputer/">Yuvansh's Computer</a><a class="nav-link" href="/ask/">Ask</a><a class="nav-link" href="/booking/">Booking</a><a class="nav-link" href="/bot/">Bot</a><a class="nav-link" href="/motto/">Motto</a><a class="nav-link" href="/redeem/">Redeem</a><a class="nav-link" href="/privacy/">Privacy Policy</a><a class="nav-link" href="/events/">Events</a></nav></div></header>
<main>{{ content }}</main>
<footer class="secret-footer"><a href="/secret-games/" aria-label="Top Secret">TOP SECRET</a></footer>
</body>
</html>
